<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Memnuniyet Anketi</title>
    <link rel="icon" id="siteFavicon" href="logoyükleyiniz.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #d4c7c700;
        }

        .survey-container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(248, 249, 250, 0.514);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="text-left mb-6">
            <img id="siteLogo" src="3N.png" alt="Logo"
                style="max-width: 200px; max-height: 120px; object-fit: contain;">
        </div>
        <div class="survey-container">
            <h3 class="text-center mb-4">Hizmet Memnuniyet Anketi</h3>
            <form id="surveyForm">
                <div id="dynamic-questions-container">
                    <div class="text-center text-muted">Sorular yükleniyor...</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4"
                    style="background-color: #5a67d8; border: none;">Anketi Gönder</button>
            </form>
        </div>
    </div>

    <script>
        let loadedQuestions = [];

        window.onload = async function () {
            loadLogo();
            try {
                // Soruları API.php'den çekiyoruz
                const response = await fetch(`api.php?action=questions`);
                loadedQuestions = await response.json();
                renderQuestions(loadedQuestions);
            } catch (error) {
                document.getElementById("dynamic-questions-container").innerHTML = "<div class='alert alert-danger'>Sorular yüklenirken hata oluştu.</div>";
            }
        };

        async function loadLogo() {
            try {
                // Logoyu admin_api.php'den çekiyoruz
                const res = await fetch(`admin_api.php?action=get_logo`);
                const data = await res.json();
                if (data && data.logo_url) {
                    document.getElementById("siteLogo").src = data.logo_url;
                    document.getElementById("siteFavicon").href = data.logo_url;
                }
            } catch (e) {
                console.error("Logo yükleme hatası:", e);
            }
        }

        function renderQuestions(questions) {
            const container = document.getElementById("dynamic-questions-container");
            container.innerHTML = "";
            questions.forEach(q => {
                let inputHtml = "";
                const isReq = (q.is_required === undefined || q.is_required === 1 || q.is_required === true);
                const reqBadge = isReq
                    ? '<span class="text-danger fw-bold ms-1">* (Zorunlu)</span>'
                    : '<span class="text-muted small ms-1">(İsteğe bağlı)</span>';
                const requiredAttr = isReq ? 'required' : '';

                if (q.question_type === "rating") {
                    inputHtml = `
                    <select class="form-select" id="question_${q.id}" ${requiredAttr}>
                        <option value="">Seçim yapın</option>
                        <option value="5">Çok İyi</option>
                        <option value="4">İyi</option>
                        <option value="3">Orta</option>
                        <option value="2">Kötü</option>
                        <option value="1">Çok Kötü</option>
                    </select>`;
                } else if (q.question_type === "text") {
                    inputHtml = `<textarea class="form-control" id="question_${q.id}" rows="3" placeholder="Düşüncelerinizi buraya yazabilirsiniz..." ${requiredAttr}></textarea>`;
                }
                const questionDiv = document.createElement("div");
                questionDiv.className = "mb-3";
                questionDiv.innerHTML = `<label class="form-label fw-bold">${q.question_text}${reqBadge}</label>${inputHtml}`;
                container.appendChild(questionDiv);
            });
        }

        document.getElementById("surveyForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const answers = [];

            // Zorunlu alan kontrolü
            for (const q of loadedQuestions) {
                const isReq = (q.is_required === undefined || q.is_required === 1 || q.is_required === true);
                const inputElement = document.getElementById(`question_${q.id}`);
                const val = inputElement ? inputElement.value.trim() : "";

                if (isReq && val === "") {
                    alert(`Lütfen zorunlu olan "${q.question_text}" sorusunu cevaplayınız.`);
                    if (inputElement) inputElement.focus();
                    return;
                }

                if (val !== "") {
                    answers.push({ question_id: q.id, answer_value: val });
                }
            }

            if (answers.length === 0) {
                alert("Anket doldurulamadı. Lütfen en az bir soruyu cevaplayınız.");
                return;
            }

            try {
                // Formu api.php'ye gönderiyoruz
                const response = await fetch(`api.php?action=submit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ answers: answers })
                });

                if (response.ok) {
                    alert("Anketiniz başarıyla gönderildi, teşekkür ederiz!");
                    document.getElementById("surveyForm").reset();
                } else {
                    const errorData = await response.json();
                    if (errorData && errorData.detail) {
                        alert(errorData.detail);
                    } else {
                        alert("Anket gönderilirken bir hata oluştu.");
                    }
                }
            } catch (error) {
                console.error("Hata:", error);
                alert("Sunucuya bağlanılamadı.");
            }
        });
    </script>
</body>

</html>
